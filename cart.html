<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UdharKart — Cart</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* ================================================================
               RESET & BASE
            ================================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-glass-border: rgba(255, 255, 255, 0.25);
            --text-primary: #0b0f1a;
            --text-secondary: #3b4358;
            --text-muted: #6b7a8f;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 16px 60px rgba(0, 0, 0, 0.08);
            --border-color: rgba(0, 0, 0, 0.06);
            --card-bg: rgba(255, 255, 255, 0.70);
            --sidebar-bg: rgba(255, 255, 255, 0.80);
            --nav-bg: rgba(255, 255, 255, 0.75);
            --input-bg: #ffffff;
            --input-border: #d0d7e2;
            --badge-bg: #2563eb;
            --badge-text: #ffffff;
            --stat-icon-bg-1: #e0f2fe;
            --stat-icon-color-1: #2563eb;
            --stat-icon-bg-2: #fce7f3;
            --stat-icon-color-2: #db2777;
            --stat-icon-bg-3: #d1fae5;
            --stat-icon-color-3: #059669;
            --stat-icon-bg-4: #fef3c7;
            --stat-icon-color-4: #d97706;
            --action-btn-bg: rgba(255, 255, 255, 0.60);
            --notif-unread-bg: #2563eb;
            --toast-bg: #1e293b;
            --toast-text: #ffffff;
            --toggle-bg: #d0d7e2;
            --toggle-active: #2563eb;
            --select-bg: #ffffff;
            --select-border: #d0d7e2;
            --scrollbar-track: #f1f3f5;
            --scrollbar-thumb: #c9ced6;
            --gradient-start: #2563eb;
            --gradient-end: #7c3aed;
            --link-color: #2563eb;
            --link-hover: #1d4ed8;
            --glass-blur: 20px;
            --radius-card: 20px;
            --radius-btn: 12px;
            --radius-input: 12px;
            --radius-full: 9999px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0e1a;
            --bg-secondary: #131b2e;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #b8c5d9;
            --text-muted: #7a8aa3;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 60px rgba(0, 0, 0, 0.5);
            --border-color: rgba(255, 255, 255, 0.06);
            --card-bg: rgba(255, 255, 255, 0.05);
            --sidebar-bg: rgba(15, 23, 42, 0.85);
            --nav-bg: rgba(15, 23, 42, 0.70);
            --input-bg: #1a2338;
            --input-border: #2d3a52;
            --badge-bg: #3b82f6;
            --badge-text: #ffffff;
            --stat-icon-bg-1: #1a2a4a;
            --stat-icon-color-1: #60a5fa;
            --stat-icon-bg-2: #3a1a2e;
            --stat-icon-color-2: #f472b6;
            --stat-icon-bg-3: #0f2a22;
            --stat-icon-color-3: #34d399;
            --stat-icon-bg-4: #2a1f0a;
            --stat-icon-color-4: #fbbf24;
            --action-btn-bg: rgba(255, 255, 255, 0.05);
            --notif-unread-bg: #3b82f6;
            --toast-bg: #f1f5f9;
            --toast-text: #0a0e1a;
            --toggle-bg: #2d3a52;
            --toggle-active: #3b82f6;
            --select-bg: #1a2338;
            --select-border: #2d3a52;
            --scrollbar-track: #131b2e;
            --scrollbar-thumb: #2d3a52;
            --gradient-start: #3b82f6;
            --gradient-end: #8b5cf6;
            --link-color: #60a5fa;
            --link-hover: #93bbfc;
            --glass-blur: 30px;
        }

        html {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 999px;
        }

        /* ================================================================
               GLASSMORPHISM UTILITIES
            ================================================================ */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--bg-glass-border);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-card);
            transition: all var(--transition);
        }

        .glass-card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ================================================================
               APP LAYOUT
            ================================================================ */
        #app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ================================================================
               SIDEBAR
            ================================================================ */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px 20px;
            transition: transform var(--transition), width var(--transition), min-width var(--transition);
            z-index: 50;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px 28px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-icon {
            font-size: 28px;
            color: var(--gradient-start);
        }

        .brand-name {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding: 4px 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-btn);
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .nav-link .material-symbols-outlined {
            font-size: 22px;
            flex-shrink: 0;
        }

        .nav-link:hover {
            background: rgba(37, 99, 235, 0.06);
            color: var(--text-primary);
        }

        .nav-link.active {
            background: rgba(37, 99, 235, 0.10);
            color: var(--gradient-start);
            font-weight: 600;
        }

        .nav-link.active .material-symbols-outlined {
            color: var(--gradient-start);
        }

        .nav-link .badge {
            margin-left: auto;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 11px;
            font-weight: 600;
            padding: 1px 9px;
            border-radius: var(--radius-full);
            line-height: 20px;
            min-width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 8px;
        }

        /* ================================================================
               MAIN WRAPPER
            ================================================================ */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* ================================================================
               TOP NAVIGATION
            ================================================================ */
        .topnav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 16px;
            min-height: 70px;
            z-index: 10;
        }

        .topnav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .topnav-left .page-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0;
            position: relative;
        }

        .icon-btn .material-symbols-outlined {
            font-size: 24px;
        }

        .icon-btn:hover {
            background: rgba(37, 99, 235, 0.06);
            color: var(--text-primary);
        }

        #sidebarToggle {
            display: none;
        }

        .topnav-center {
            flex: 1;
            max-width: 480px;
            margin: 0 16px;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-full);
            padding: 0 16px;
            transition: all 0.2s;
            height: 42px;
        }

        .search-wrap:focus-within {
            border-color: var(--gradient-start);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .search-icon {
            color: var(--text-muted);
            font-size: 20px;
            margin-right: 10px;
        }

        .search-input {
            border: none;
            background: transparent;
            width: 100%;
            padding: 8px 0;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .topnav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .notification-btn {
            position: relative;
        }

        .badge-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--nav-bg);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            background: var(--gradient-start);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar .material-symbols-outlined {
            font-size: 32px;
            color: #fff;
        }

        /* ================================================================
               PAGE CONTAINER
            ================================================================ */
        .page-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px 40px;
            background: var(--bg-primary);
            transition: background var(--transition);
        }

        /* ================================================================
               PAGE HEADER
            ================================================================ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .page-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ================================================================
               CART LAYOUT
            ================================================================ */
        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            align-items: start;
        }

        /* ================================================================
               CART ITEMS
            ================================================================ */
        .cart-items-card {
            padding: 20px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--bg-glass-border);
            border-radius: var(--radius-card);
        }

        .cart-items-card .cart-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .cart-items-card .cart-header-row h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .cart-items-card .cart-header-row .item-count {
            font-size: 14px;
            color: var(--text-muted);
        }

        .cart-items-card .cart-header-row .clear-cart-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            padding: 4px 12px;
            border-radius: var(--radius-btn);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cart-items-card .cart-header-row .clear-cart-btn:hover {
            background: rgba(220, 38, 38, 0.08);
            color: #dc2626;
        }

        .cart-items-card .cart-header-row .clear-cart-btn .material-symbols-outlined {
            font-size: 18px;
        }

        /* Cart item */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .item-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-btn);
            background: var(--bg-glass);
            border: 1px solid var(--bg-glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cart-item .item-icon .material-symbols-outlined {
            font-size: 28px;
            color: var(--text-muted);
        }

        .cart-item .item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item .item-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .cart-item .item-info .item-category {
            font-size: 12px;
            color: var(--text-muted);
        }

        .cart-item .item-info .item-price {
            font-size: 13px;
            font-weight: 500;
            color: var(--gradient-start);
            margin-top: 2px;
        }

        .cart-item .qty-control {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .cart-item .qty-control button {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .cart-item .qty-control button:hover {
            background: var(--gradient-start);
            color: #fff;
            border-color: var(--gradient-start);
        }

        .cart-item .qty-control button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .cart-item .qty-control button:disabled:hover {
            background: var(--input-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .cart-item .qty-control span {
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            font-size: 15px;
            color: var(--text-primary);
        }

        .cart-item .item-total {
            font-weight: 700;
            color: var(--text-primary);
            min-width: 80px;
            text-align: right;
            font-size: 15px;
            flex-shrink: 0;
        }

        .cart-item .remove-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-full);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cart-item .remove-item:hover {
            background: rgba(220, 38, 38, 0.08);
            color: #dc2626;
        }

        .cart-item .remove-item .material-symbols-outlined {
            font-size: 20px;
        }

        /* ================================================================
               CART SUMMARY
            ================================================================ */
        .cart-summary-card {
            padding: 24px 24px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--bg-glass-border);
            border-radius: var(--radius-card);
            position: sticky;
            top: 20px;
        }

        .cart-summary-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .summary-row .label {
            color: var(--text-muted);
        }

        .summary-row .value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .summary-row.discount .value {
            color: #059669;
        }

        .summary-row.total {
            padding-top: 12px;
            margin-top: 8px;
            border-top: 2px solid var(--border-color);
            font-size: 18px;
            font-weight: 700;
        }

        .summary-row.total .label {
            color: var(--text-primary);
        }

        .summary-row.total .value {
            color: var(--gradient-start);
            font-size: 22px;
        }

        .cart-summary-card .checkout-btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #fff;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }

        .cart-summary-card .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.30);
        }

        .cart-summary-card .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .cart-summary-card .checkout-btn .material-symbols-outlined {
            font-size: 22px;
        }

        /* ================================================================
               EMPTY CART
            ================================================================ */
        .empty-cart {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
        }

        .empty-cart .empty-icon {
            font-size: 64px;
            opacity: 0.3;
        }

        .empty-cart h4 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-cart p {
            font-size: 14px;
            max-width: 320px;
        }

        .empty-cart .btn {
            margin-top: 8px;
        }

        /* ================================================================
               BTN
            ================================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            line-height: 1.4;
        }

        .btn .material-symbols-outlined {
            font-size: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #fff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.30);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            border-color: var(--text-muted);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-success {
            background: #059669;
            color: #fff;
        }

        .btn-success:hover {
            background: #047857;
        }

        /* ================================================================
               TOAST
            ================================================================ */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 16px 20px;
            border-radius: var(--radius-btn);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.4s ease forwards;
            font-size: 14px;
            font-weight: 500;
            min-height: 54px;
        }

        .toast .material-symbols-outlined {
            font-size: 24px;
            flex-shrink: 0;
        }

        .toast.hide {
            animation: slideOutRight 0.3s ease forwards;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(60px);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================================================================
               RESPONSIVE
            ================================================================ */
        @media (max-width: 1024px) {
            .cart-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cart-summary-card {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                width: 280px;
                min-width: 280px;
                z-index: 100;
                box-shadow: var(--shadow-lg);
                border-right: 1px solid var(--border-color);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            #sidebarToggle {
                display: flex;
            }

            .topnav {
                padding: 12px 16px;
                min-height: 60px;
            }

            .topnav-center {
                margin: 0 8px;
                max-width: 300px;
            }

            .search-wrap {
                height: 36px;
                padding: 0 12px;
            }

            .search-input {
                font-size: 13px;
            }

            .page-container {
                padding: 16px 16px 32px;
            }

            .page-header h2 {
                font-size: 20px;
            }

            .cart-items-card {
                padding: 16px 16px;
            }

            .cart-item {
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px 0;
            }

            .cart-item .item-info {
                flex: 1 1 100%;
                order: 2;
            }

            .cart-item .item-icon {
                order: 1;
            }

            .cart-item .qty-control {
                order: 3;
                margin-left: 64px;
            }

            .cart-item .item-total {
                order: 4;
                min-width: 60px;
            }

            .cart-item .remove-item {
                order: 5;
            }

            .cart-summary-card {
                padding: 18px 16px 22px;
            }

            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .topnav-center {
                display: none;
            }

            .cart-item .qty-control button {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .cart-item .qty-control span {
                min-width: 22px;
                font-size: 14px;
            }

            .cart-item .item-total {
                font-size: 14px;
                min-width: 50px;
            }

            .cart-summary-card .checkout-btn {
                font-size: 14px;
                padding: 12px;
            }

            .summary-row.total {
                font-size: 16px;
            }

            .summary-row.total .value {
                font-size: 20px;
            }

            .page-header .header-actions .btn {
                font-size: 12px;
                padding: 6px 14px;
            }
            .page-header .header-actions .btn .material-symbols-outlined {
                font-size: 18px;
            }

            .empty-cart .empty-icon {
                font-size: 48px;
            }
            .empty-cart h4 {
                font-size: 18px;
            }
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 90;
            display: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Coupon input */
        .coupon-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .coupon-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .coupon-row input:focus {
            border-color: var(--gradient-start);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .coupon-row button {
            padding: 8px 16px;
            border-radius: var(--radius-btn);
            border: none;
            background: var(--gradient-start);
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .coupon-row button:hover {
            background: var(--gradient-end);
        }
    </style>
</head>
<body>

    <!-- ================================================================ -->
    <!--  ROOT APP                                                         -->
    <!-- ================================================================ -->
    <div id="app">

        <!-- Sidebar overlay (mobile) -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- ============================================================ -->
        <!--  SIDEBAR                                                       -->
        <!-- ============================================================ -->
        <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
            <div class="sidebar-brand">
                <span class="brand-icon material-symbols-outlined">storefront</span>
                <span class="brand-name">UdharKart</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a href="orders.html" class="nav-link">
                    <span class="material-symbols-outlined">receipt_long</span>
                    <span>Orders</span>
                    <span class="badge">4</span>
                </a>
                <a href="products.html" class="nav-link">
                    <span class="material-symbols-outlined">inventory_2</span>
                    <span>Products</span>
                </a>
                <a href="cart.html" class="nav-link active">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span>Cart</span>
                    <span class="badge" id="cartBadge">3</span>
                </a>
                <a href="billing.html" class="nav-link">
                    <span class="material-symbols-outlined">receipt</span>
                    <span>Billing</span>
                </a>
                <a href="profile.html" class="nav-link">
                    <span class="material-symbols-outlined">person</span>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-link">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- ============================================================ -->
        <!--  MAIN WRAPPER                                                 -->
        <!-- ============================================================ -->
        <div class="main-wrapper">

            <!-- ========================================================== -->
            <!--  TOP NAV                                                    -->
            <!-- ========================================================== -->
            <header class="topnav">
                <div class="topnav-left">
                    <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h1 class="page-title" id="pageTitle">Cart</h1>
                </div>

                <div class="topnav-center">
                    <div class="search-wrap">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input type="text" class="search-input" placeholder="Search in cart..." aria-label="Search in cart" id="cartSearch" />
                    </div>
                </div>

                <div class="topnav-right">
                    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
                        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
                    </button>
                    <a href="notifications.html" class="icon-btn notification-btn">
                        <span class="material-symbols-outlined">notifications</span>
                        <span class="badge-dot"></span>
                    </a>
                    <div class="avatar" role="img" aria-label="User avatar">
                        <span class="material-symbols-outlined">account_circle</span>
                    </div>
                </div>
            </header>

            <!-- ========================================================== -->
            <!--  PAGE CONTENT                                              -->
            <!-- ========================================================== -->
            <main class="page-container">

                <!-- ===== PAGE HEADER ===== -->
                <div class="page-header">
                    <h2>Shopping Cart</h2>
                    <div class="header-actions">
                        <button class="btn btn-secondary btn-sm" id="continueShoppingBtn">
                            <span class="material-symbols-outlined">arrow_back</span>
                            Continue Shopping
                        </button>
                    </div>
                </div>

                <!-- ===== CART LAYOUT ===== -->
                <div class="cart-layout">

                    <!-- ===== CART ITEMS ===== -->
                    <div class="cart-items-card glass-card" id="cartItemsCard">
                        <div class="cart-header-row">
                            <div style="display:flex;align-items:center;gap:12px;">
                                <h3>Your Items</h3>
                                <span class="item-count" id="itemCount">3 items</span>
                            </div>
                            <button class="clear-cart-btn" id="clearCartBtn">
                                <span class="material-symbols-outlined">delete_sweep</span>
                                Clear Cart
                            </button>
                        </div>

                        <div id="cartItemsList">
                            <!-- Cart items rendered by JS -->
                        </div>
                    </div>

                    <!-- ===== CART SUMMARY ===== -->
                    <div class="cart-summary-card glass-card" id="cartSummary">
                        <h3>Order Summary</h3>

                        <div class="summary-row">
                            <span class="label">Subtotal</span>
                            <span class="value" id="subtotal">₹0</span>
                        </div>
                        <div class="summary-row">
                            <span class="label">Shipping</span>
                            <span class="value" id="shipping">₹0</span>
                        </div>
                        <div class="summary-row discount" id="discountRow" style="display:none;">
                            <span class="label">Discount (SAVE10)</span>
                            <span class="value" id="discountAmount">-₹0</span>
                        </div>
                        <div class="summary-row total">
                            <span class="label">Total</span>
                            <span class="value" id="grandTotal">₹0</span>
                        </div>

                        <!-- Coupon -->
                        <div class="coupon-row">
                            <input type="text" id="couponInput" placeholder="Enter coupon code" />
                            <button id="applyCouponBtn">Apply</button>
                        </div>

                        <button class="checkout-btn" id="checkoutBtn">
                            <span class="material-symbols-outlined">payments</span>
                            Proceed to Checkout
                        </button>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <!-- ================================================================ -->
    <!--  TOAST CONTAINER                                                 -->
    <!-- ================================================================ -->
    <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

    <!-- ================================================================ -->
    <!--  JAVASCRIPT                                                      -->
    <!-- ================================================================ -->
    <script>
        (function() {
            'use strict';

            // =============================================================
            //  DOM REFS
            // =============================================================
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const toastContainer = document.getElementById('toastContainer');
            const cartItemsList = document.getElementById('cartItemsList');
            const itemCount = document.getElementById('itemCount');
            const subtotalEl = document.getElementById('subtotal');
            const shippingEl = document.getElementById('shipping');
            const discountRow = document.getElementById('discountRow');
            const discountAmountEl = document.getElementById('discountAmount');
            const grandTotalEl = document.getElementById('grandTotal');
            const clearCartBtn = document.getElementById('clearCartBtn');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const applyCouponBtn = document.getElementById('applyCouponBtn');
            const couponInput = document.getElementById('couponInput');
            const cartSearch = document.getElementById('cartSearch');
            const cartBadge = document.getElementById('cartBadge');
            const continueShoppingBtn = document.getElementById('continueShoppingBtn');

            // =============================================================
            //  STATE
            // =============================================================
            let isDark = false;
            let isSidebarOpen = false;
            let appliedCoupon = false;

            // =============================================================
            //  SAMPLE CART DATA
            // =============================================================
            let cartItems = [
                { id: 1, name: 'Basmati Rice (5kg)', category: 'Groceries', price: 350, quantity: 2,
                icon: 'rice_bowl' },
                { id: 3, name: 'Wheat Flour (5kg)', category: 'Groceries', price: 220, quantity: 1,
                    icon: 'bakery_dining' },
                { id: 5, name: 'Milk (1L)', category: 'Dairy', price: 56, quantity: 4, icon: 'no_drinks' },
                { id: 9, name: 'Coca-Cola (2L)', category: 'Beverages', price: 90, quantity: 3,
                    icon: 'local_drink' },
                { id: 13, name: 'Lays (50g)', category: 'Snacks', price: 20, quantity: 5, icon: 'fastfood' },
            ];

            // =============================================================
            //  HELPERS
            // =============================================================
            function formatPrice(amount) {
                return '₹' + amount.toLocaleString('en-IN');
            }

            function getTotalItems() {
                return cartItems.reduce((sum, item) => sum + item.quantity, 0);
            }

            function getSubtotal() {
                return cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
            }

            function getShipping() {
                const subtotal = getSubtotal();
                if (subtotal === 0) return 0;
                return subtotal >= 500 ? 0 : 40;
            }

            function getDiscount() {
                return appliedCoupon ? Math.round(getSubtotal() * 0.10) : 0;
            }

            function getGrandTotal() {
                return getSubtotal() + getShipping() - getDiscount();
            }

            // =============================================================
            //  RENDER CART
            // =============================================================
            function renderCart() {
                const searchTerm = cartSearch.value.toLowerCase().trim();
                let filteredItems = cartItems;

                if (searchTerm) {
                    filteredItems = cartItems.filter(item =>
                        item.name.toLowerCase().includes(searchTerm) ||
                        item.category.toLowerCase().includes(searchTerm)
                    );
                }

                if (cartItems.length === 0) {
                    cartItemsList.innerHTML = `
                            <div class="empty-cart">
                                <span class="material-symbols-outlined empty-icon">shopping_cart</span>
                                <h4>Your cart is empty</h4>
                                <p>Looks like you haven't added any items to your cart yet.</p>
                                <a href="products.html" class="btn btn-primary">Browse Products</a>
                            </div>
                        `;
                    itemCount.textContent = '0 items';
                    updateSummary();
                    updateBadge();
                    checkoutBtn.disabled = true;
                    return;
                }

                if (filteredItems.length === 0) {
                    cartItemsList.innerHTML = `
                            <div class="empty-cart" style="padding:24px 0;">
                                <span class="material-symbols-outlined empty-icon" style="font-size:40px;">search</span>
                                <h4 style="font-size:16px;">No items match your search</h4>
                                <p style="font-size:13px;">Try adjusting your search terms.</p>
                            </div>
                        `;
                    itemCount.textContent = getTotalItems() + ' items';
                    updateSummary();
                    updateBadge();
                    checkoutBtn.disabled = false;
                    return;
                }

                let html = '';
                filteredItems.forEach((item, index) => {
                    const total = item.price * item.quantity;
                    html += `
                            <div class="cart-item" data-id="${item.id}" data-index="${index}">
                                <div class="item-icon">
                                    <span class="material-symbols-outlined">${item.icon || 'shopping_bag'}</span>
                                </div>
                                <div class="item-info">
                                    <h4>${item.name}</h4>
                                    <span class="item-category">${item.category}</span>
                                    <div class="item-price">${formatPrice(item.price)} each</div>
                                </div>
                                <div class="qty-control">
                                    <button class="qty-decrease" data-id="${item.id}" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
                                    <span>${item.quantity}</span>
                                    <button class="qty-increase" data-id="${item.id}">+</button>
                                </div>
                                <div class="item-total">${formatPrice(total)}</div>
                                <button class="remove-item" data-id="${item.id}" aria-label="Remove item">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                            </div>
                        `;
                });

                cartItemsList.innerHTML = html;
                itemCount.textContent = getTotalItems() + ' items';
                updateSummary();
                updateBadge();
                checkoutBtn.disabled = false;

                // =============================================================
                //  ATTACH EVENT LISTENERS
                // =============================================================
                // Quantity increase
                document.querySelectorAll('.qty-increase').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = cartItems.find(i => i.id === id);
                        if (item) {
                            item.quantity++;
                            renderCart();
                            showToast(`Updated "${item.name}" quantity`, 'shopping_cart');
                        }
                    });
                });

                // Quantity decrease
                document.querySelectorAll('.qty-decrease').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = cartItems.find(i => i.id === id);
                        if (item && item.quantity > 1) {
                            item.quantity--;
                            renderCart();
                            showToast(`Updated "${item.name}" quantity`, 'shopping_cart');
                        }
                    });
                });

                // Remove item
                document.querySelectorAll('.remove-item').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = cartItems.find(i => i.id === id);
                        if (item) {
                            cartItems = cartItems.filter(i => i.id !== id);
                            renderCart();
                            showToast(`Removed "${item.name}" from cart`, 'delete');
                        }
                    });
                });
            }

            // =============================================================
            //  UPDATE SUMMARY
            // =============================================================
            function updateSummary() {
                const subtotal = getSubtotal();
                const shipping = getShipping();
                const discount = getDiscount();
                const grandTotal = getGrandTotal();

                subtotalEl.textContent = formatPrice(subtotal);
                shippingEl.textContent = shipping === 0 ? 'Free' : formatPrice(shipping);

                if (discount > 0) {
                    discountRow.style.display = 'flex';
                    discountAmountEl.textContent = '-' + formatPrice(discount);
                } else {
                    discountRow.style.display = 'none';
                }

                grandTotalEl.textContent = formatPrice(grandTotal);
            }

            // =============================================================
            //  UPDATE BADGE
            // =============================================================
            function updateBadge() {
                const total = getTotalItems();
                if (total > 0) {
                    cartBadge.textContent = total;
                    cartBadge.style.display = '';
                } else {
                    cartBadge.textContent = '0';
                    cartBadge.style.display = 'none';
                }
            }

            // =============================================================
            //  THEME
            // =============================================================
            function setTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                themeIcon.textContent = dark ? 'light_mode' : 'dark_mode';
            }

            function toggleTheme() {
                setTheme(!isDark);
            }

            // =============================================================
            //  SIDEBAR
            // =============================================================
            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                isSidebarOpen = true;
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                isSidebarOpen = false;
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (isSidebarOpen) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            // =============================================================
            //  TOAST
            // =============================================================
            function showToast(message, icon = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `
                        <span class="material-symbols-outlined">${icon}</span>
                        <span>${message}</span>
                    `;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 300);
                }, 3000);
            }

            // =============================================================
            //  EVENT BINDING
            // =============================================================
            toggleBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', closeSidebar);
            themeToggle.addEventListener('click', toggleTheme);

            // Clear cart
            clearCartBtn.addEventListener('click', function() {
                if (cartItems.length === 0) {
                    showToast('Cart is already empty', 'info');
                    return;
                }
                cartItems = [];
                appliedCoupon = false;
                couponInput.value = '';
                renderCart();
                showToast('Cart cleared', 'delete_sweep');
            });

            // Checkout
            checkoutBtn.addEventListener('click', function() {
                if (cartItems.length === 0) {
                    showToast('Your cart is empty', 'error');
                    return;
                }
                showToast('Redirecting to checkout...', 'payments');
                setTimeout(() => {
                    window.location.href = 'billing.html';
                }, 600);
            });

            // Apply coupon
            applyCouponBtn.addEventListener('click', function() {
                const code = couponInput.value.trim().toUpperCase();
                if (!code) {
                    showToast('Please enter a coupon code', 'error');
                    return;
                }
                if (code === 'SAVE10') {
                    if (appliedCoupon) {
                        showToast('Coupon already applied', 'info');
                        return;
                    }
                    appliedCoupon = true;
                    renderCart();
                    showToast('🎉 Coupon SAVE10 applied! 10% discount', 'redeem');
                } else {
                    showToast('Invalid coupon code. Try SAVE10', 'error');
                }
            });

            // Coupon input enter key
            couponInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    applyCouponBtn.click();
                }
            });

            // Search in cart
            cartSearch.addEventListener('input', renderCart);

            // Continue shopping
            continueShoppingBtn.addEventListener('click', function() {
                window.location.href = 'products.html';
            });

            // =============================================================
            //  RESIZE HANDLER
            // =============================================================
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.innerWidth > 768 && isSidebarOpen) {
                        closeSidebar();
                    }
                }, 200);
            });

            // =============================================================
            //  INIT
            // =============================================================
            function init() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark);
                renderCart();

                setTimeout(() => {
                    showToast('Cart loaded successfully', 'shopping_cart');
                }, 400);

                // Highlight active nav
                const currentPath = window.location.pathname.split('/').pop() || 'cart.html';
                document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
                    link.classList.remove('active');
                    const href = link.getAttribute('href');
                    if (href === currentPath) {
                        link.classList.add('active');
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', init);
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            }

        })();
    </script>

</body>
</html>
